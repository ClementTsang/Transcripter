name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Which tag to deploy as:"
        required: true

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build:
    name: "Build binaries"
    runs-on: ${{ matrix.info.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        info:
          - target: "linux-x64"
            rid: "linux-x64"
            os: "ubuntu-latest"
          - target: "linux-arm64"
            rid: "linux-arm64"
            os: "ubuntu-latest"
          - target: "windows-x64"
            rid: "win-x64"
            os: "windows-latest"
          - target: "macos-arm64"
            rid: "osx-arm64"
            os: "macos-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Publish release binary
        shell: bash
        run: |
          cd TranscripterUI
          dotnet publish -c Release -r ${{ matrix.info.rid }} --self-contained true -o ./publish-output
          cd ..
          mkdir -p publish
          mv TranscripterUI/publish-output ./publish/${{ matrix.info.target }}

      - name: Archive release binary (tar.gz)
        if: matrix.info.os != 'windows-latest'
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag }}
          TARGET: ${{ matrix.info.target }}
        run: |
          mkdir -p release
          tar czf "release/TranscripterUI-${TAG}-${TARGET}.tar.gz" -C publish "${TARGET}"

      - name: Archive release binary (zip)
        if: matrix.info.os == 'windows-latest'
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag }}
          TARGET: ${{ matrix.info.target }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "publish/$env:TARGET" -DestinationPath "release/TranscripterUI-$env:TAG-$env:TARGET.zip"

      - name: Generate artifact attestation for file
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*

      - name: Save release as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          retention-days: 3
          name: release-${{ matrix.info.target }}
          path: release

  upload-release:
    name: upload-release
    runs-on: ubuntu-24.04
    needs: [build]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Set release version
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_EVENT_INPUTS_TAG}" >> $GITHUB_ENV
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Validate release version
        run: |
          echo "Release version: ${RELEASE_VERSION}"

      - name: Get release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Print out all release files
        run: |
          echo "Generated $(ls ./release | wc -l) files:"
          du -h -d 0 ./release/*

      - name: Create release with files
        run: |
          gh release create "${RELEASE_VERSION}" ./release/* --title "${RELEASE_VERSION} Release" --draft --generate-notes --fail-on-no-commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
